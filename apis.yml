aid: curlie
name: Curlie
description: >-
  Curlie is a multilingual, human-edited web directory and the official successor
  to the Open Directory Project (ODP), also known as DMOZ. After the DMOZ directory
  was shut down in March 2017, the editor community relaunched the project as Curlie
  to continue cataloging websites by topic across more than 90 languages. Curlie
  is maintained entirely by volunteer editors who review and categorize submitted
  sites into a hierarchical taxonomy used as a reference by search engines and researchers.
